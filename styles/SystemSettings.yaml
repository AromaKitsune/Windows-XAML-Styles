theme: ClassicSearchBar

controlStyles:
  # User Profile Text
  - target: // TextBlock#UserName
    styles:
      - Text=Username Here
      - FontSize=16
      - ToolTipService.ToolTip:=

  - target: // TextBlock#UserAccount
    styles:
      - Text=Microsoft Account
      - ToolTipService.ToolTip:=

  # Hide the MS 365 & OneDrive buttons
  - target: >
      SystemSettings.View.AlignableContentControl#heroContent >
      ContentPresenter > SystemSettings.View.AlignableContentControl >
      ItemsControl > ItemsPresenter > StackPanel > ContentPresenter >
      SystemSettings.View.AlignableContentControl > ContentPresenter >
      SystemSettings.View.HeroUserControl#HeroUserControl > Grid#LayoutRoot >
      ItemsControl#CharmGrid > ItemsPresenter >
      SystemSettings.View.EntityWrapPanel#CharmEntityWrapPanel >
      ContentPresenter[1]
    styles:
      - Visibility=Collapsed

  - target: >
      SystemSettings.View.AlignableContentControl#heroContent >
      ContentPresenter > SystemSettings.View.AlignableContentControl >
      ItemsControl > ItemsPresenter > StackPanel > ContentPresenter >
      SystemSettings.View.AlignableContentControl > ContentPresenter >
      SystemSettings.View.HeroUserControl#HeroUserControl > Grid#LayoutRoot >
      ItemsControl#CharmGrid > ItemsPresenter >
      SystemSettings.View.EntityWrapPanel#CharmEntityWrapPanel >
      ContentPresenter[2]
    styles:
      - Visibility=Collapsed

  # Network Data Usage indicator bars
  # Make it less eyesore with Dark theme
  - target: ProgressBar#appBar > Grid > Border#DeterminateRoot
    styles:
      - Background=#60808080

  # Bluetooth & devices - Device names
  # Wrap the device names into two lines
  - target: >
      SystemSettings.View.SettingsListView#DevicesHeroControlList > Border >
      ScrollViewer#ScrollViewer > Border#Root > Grid >
      ScrollContentPresenter#ScrollContentPresenter > ItemsPresenter >
      StackPanel > SystemSettings.View.SettingsListViewItem >
      Windows.UI.Xaml.Controls.Primitives.ListViewItemPresenter#Root >
      ContentControl > ContentPresenter > UserControl >
      Button#DevicesHeroControlButton > ContentPresenter#ContentPresenter >
      StackPanel > ContentPresenter > StackPanel > ContentControl >
      ContentPresenter > TextBlock
    styles:
      - TextWrapping=2
      - MaxLines=2

  # Fix some issues when navigating to Personalization → Background
  # - The in-line navigation pane BG becomes opaque, resulting in no Mica effect
  - target: Grid@DisplayModeStates > Grid#PaneRoot
    styles:
      - Background@OpenInlineLeft=Transparent
      - // Background@OpenOverlayLeft:=<SolidColorBrush FallbackColor="{StaticResource SystemChromeMediumColor}" />
      - // Background@Closed:=<SolidColorBrush FallbackColor="{StaticResource SystemChromeMediumColor}" />
